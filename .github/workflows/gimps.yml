name: GIMPS World Record Hunt

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  gimps:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Restore mprime state
        uses: actions/cache@v4
        with:
          path: |
            mprime
            worktodo.txt
            results.txt
            known.txt
            *.proof
          key: gimps-state-v2

      - name: Download mprime
        run: |
          if [ ! -f mprime ]; then
            curl -L -o mprime.tar.gz "https://drive.usercontent.google.com/download?id=16Nim-NX6BGYjcsPBkq1tDbc_8qnwghSB&export=download"
            tar xzf mprime.tar.gz
            chmod +x mprime
            rm -f mprime.tar.gz
          fi

      - name: Configure mprime
        run: |
          echo "[PrimeNet]" > prime.txt
          echo "V3UserID=DeltaKronecker" >> prime.txt
          echo "ComputerGuid=34E979D2D31A4F0C9A1B2C3D4E5F6071" >> prime.txt
          echo "NumWorkers=1" >> prime.txt
          echo "DaysOfWork=3" >> prime.txt
          echo "MinTFTBits=68" >> prime.txt
          echo "MaxTFTBits=999" >> prime.txt
          echo "WorkPreference=150" >> prime.txt
          echo "CpuHours=24" >> prime.txt
          echo "--- prime.txt generated ---"
          cat prime.txt

      - name: Run mprime
        run: |
          timeout 20900 ./mprime -d || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gimps-results
          path: |
            results.txt
            known.txt
            quit.txt
            worktodo.txt
            prime.txt
            *.proof
          retention-days: 90