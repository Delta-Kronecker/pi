name: GIMPS World Record Hunt

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  gimps:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Restore mprime state
        uses: actions/cache@v4
        with:
          path: |
            mprime
            worktodo.txt
            results.txt
            known.txt
            *.proof
          key: gimps-state-v3

      - name: Download mprime
        run: |
          if [ ! -f mprime ]; then
            curl -sL -o mprime.tar.gz "https://drive.usercontent.google.com/download?id=16Nim-NX6BGYjcsPBkq1tDbc_8qnwghSB&export=download"
            tar xzf mprime.tar.gz
            chmod +x mprime
            rm -f mprime.tar.gz
          fi

      - name: Configure mprime
        run: |
          cat > prime.txt << 'PRIMETXT'
V24OptionsConverted=1
UsePrimenet=1
StressTester=0
CpuNumThreads=2
MaxMem=6000
UseLargePages=0
V30Compat=1
V3UserID=DeltaKronecker
ComputerGuid=34E979D2D31A4F0C9A1B2C3D4E5F6071
PRIMETXT
          cat > local.txt << 'LOCALTXT'
Audio=0
RollerCoaster=0
LOCALTXT
          echo "=== prime.txt ==="
          cat prime.txt
          echo "=== local.txt ==="
          cat local.txt

      - name: Run mprime
        run: |
          timeout 20900 ./mprime -d < /dev/null || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gimps-results
          path: |
            results.txt
            known.txt
            quit.txt
            worktodo.txt
            prime.txt
            local.txt
            *.proof
          retention-days: 90