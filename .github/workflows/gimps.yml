name: GIMPS World Record Hunt

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  gimps:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Restore mprime state
        uses: actions/cache@v4
        with:
          path: |
            mprime
            prime.txt
            local.txt
            worktodo.txt
            results.txt
            known.txt
            *.proof
          key: gimps-state

      - name: Download mprime
        run: |
          if [ ! -f mprime ]; then
            curl -L -o mprime.tar.gz "https://drive.usercontent.google.com/download?id=16Nim-NX6BGYjcsPBkq1tDbc_8qnwghSB&export=download"
            tar xzf mprime.tar.gz
            chmod +x mprime
            rm -f mprime.tar.gz
          fi

      - name: Configure mprime
        run: |
          if [ ! -f prime.txt ]; then
            printf '%s\n' \
              "V24OptionsConverted=1" \
              "UsePrimenet=1" \
              "StressTester=0" \
              "CpuNumThreads=2" \
              "MaxMem=6000" \
              "UseLargePages=0" \
              "V30Compat=1" \
              "User=DeltaKronecker" \
              "ComputerName=github-actions" \
              > prime.txt
          fi
          if [ ! -f local.txt ]; then
            printf '%s\n' "Audio=0" "RollerCoaster=0" > local.txt
          fi

      - name: Run mprime
        run: |
          timeout 20900 ./mprime -d || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gimps-results
          path: |
            results.txt
            known.txt
            quit.txt
            worktodo.txt
            prime.txt
            *.proof
          retention-days: 90
